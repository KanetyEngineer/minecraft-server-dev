# Game Lobby の設定。行き先を足すときは destinations に1つ追加して /lobbyadmin reload → /lobbyadmin rebuild
# host/port はプレイヤーのPCから届く「公開アドレス」を書く（転送はプレイヤーが自分でつなぎ直すため localhost は不可）
# version: 行き先サーバーと同じ Minecraft の版。違う版のクライアントは転送せず案内を出す
# require-brand: クライアントの種類（fabric など）。MOD が必要な行き先に使う
# enabled: false の行き先、または host が空の行き先は「準備中」と表示して転送しない
# このファイルを保存すると、動いているロビーが数秒で読み直してゲートを作り直す

lobby-name: "<gold><bold>GAME LOBBY</bold></gold>"
lobby-address: "stamina-proves.tun.ply.gg"

destinations:
