name: decompile-light
on:
  push:
    branches: [claude/decompile-light]
jobs:
  dump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.20.1', '1.20.4', '1.21.1', '1.21.11']
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: Project
        run: |
          mkdir -p /tmp/p/src/main/java && cd /tmp/p
          cat > settings.gradle <<'X'
          pluginManagement { repositories { maven { url = 'https://maven.fabricmc.net/' }; gradlePluginPortal() } }
          rootProject.name = 'dump'
          X
          cat > build.gradle <<X
          plugins { id 'net.fabricmc.fabric-loom-remap' version '1.16-SNAPSHOT' }
          dependencies {
            minecraft "com.mojang:minecraft:${{ matrix.mc }}"
            mappings loom.officialMojangMappings()
            modImplementation "net.fabricmc:fabric-loader:0.17.2"
          }
          X
      - name: genSources
        working-directory: /tmp/p
        run: gradle --no-daemon genSourcesWithVineflower
      - name: Dump
        run: |
          SRC=$(find ~/.gradle /tmp/p -name 'minecraft-*sources.jar' 2>/dev/null | grep -F '${{ matrix.mc }}' | head -5)
          echo "$SRC"
          mkdir -p /tmp/src && for j in $SRC; do unzip -oq "$j" -d /tmp/src; done
          cd /tmp/src
          for f in net/minecraft/server/level/ThreadedLevelLightEngine.java net/minecraft/world/level/lighting/LevelLightEngine.java; do echo "=================== $f"; cat -n $f; done
          for f in net/minecraft/world/level/lighting/LightEngine.java net/minecraft/world/level/lighting/LayerLightEngine.java net/minecraft/world/level/lighting/LayerLightSectionStorage.java; do [ -f $f ] && { echo "=================== $f (sigs)"; grep -n -E "^\s*(public|protected|private|static).*\(|runLightUpdates|runUpdates|MAX|queue" $f; }; done
          for f in net/minecraft/server/level/ChunkMap.java net/minecraft/server/level/ServerChunkCache.java net/minecraft/server/level/ChunkHolder.java net/minecraft/server/level/GenerationChunkHolder.java net/minecraft/world/level/chunk/status/ChunkStatusTasks.java net/minecraft/world/level/chunk/ChunkStatus.java; do [ -f $f ] && { echo "=================== $f (light lines)"; grep -n -i -E "light" $f; }; done
          true
