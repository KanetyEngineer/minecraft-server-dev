name: decompile-light
on:
  push:
    branches: [claude/decompile-light]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: genSources
        working-directory: mods/solaria-tweaks
        run: gradle --no-daemon genSourcesWithVineflower
      - name: Dump villager sources
        run: |
          SRC=$(find ~/.gradle /home/runner -name 'minecraft-*sources.jar' 2>/dev/null | grep -i 1.21.11 | head -5)
          mkdir -p /tmp/src && for j in $SRC; do unzip -oq "$j" -d /tmp/src; done
          cd /tmp/src
          for f in $(find . -name 'AbstractVillager.java' -o -name 'MerchantMenu.java' -o -name 'Merchant.java' -o -name 'ClientSideMerchant.java' -o -name 'MerchantResultSlot.java'); do echo "=================== $f"; cat -n $f; done
          V=$(find . -name 'Villager.java' | head -1); echo "=================== $V"; cat -n $V
          echo "=================== Entity remove"; grep -n -E "void remove|setRemoved|onRemoval|unsetRemoved|isAlive|RemovalReason" net/minecraft/world/entity/Entity.java
          echo "=================== Player containerMenu"; grep -n -B2 -A8 "stillValid" net/minecraft/world/entity/player/Player.java net/minecraft/server/level/ServerPlayer.java
          echo "=================== ServerGamePacketListenerImpl merchant"; grep -n -B3 -A15 -i "SelectTrade\|MerchantMenu" net/minecraft/server/network/ServerGamePacketListenerImpl.java
