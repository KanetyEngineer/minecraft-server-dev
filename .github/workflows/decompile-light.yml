name: decompile-light
on:
  push:
    branches: [claude/decompile-light]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: genSources
        working-directory: mods/solaria-tweaks
        run: gradle --no-daemon genSourcesWithVineflower
      - name: Dump light engine sources
        run: |
          SRC=$(find ~/.gradle /home/runner -name 'minecraft-*sources.jar' 2>/dev/null | grep -i 1.21.11 | head -5)
          echo "$SRC"
          mkdir -p /tmp/src && for j in $SRC; do unzip -oq "$j" -d /tmp/src; done
          cd /tmp/src
          for f in net/minecraft/server/level/ThreadedLevelLightEngine.java net/minecraft/world/level/lighting/LevelLightEngine.java net/minecraft/world/level/lighting/LightEngine.java net/minecraft/world/level/lighting/BlockLightEngine.java; do echo "=================== $f"; cat -n $f; done
          for f in net/minecraft/server/level/ChunkMap.java net/minecraft/server/level/ServerChunkCache.java net/minecraft/server/MinecraftServer.java net/minecraft/world/level/chunk/storage/SerializableChunkData.java net/minecraft/server/level/GenerationChunkHolder.java net/minecraft/server/level/ChunkHolder.java; do echo "=================== $f (light lines)"; grep -n -i -E "light" $f; done
      - uses: actions/upload-artifact@v4
        with: { name: src, path: /tmp/src/net/minecraft/server/level }
