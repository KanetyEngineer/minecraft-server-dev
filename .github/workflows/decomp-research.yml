name: decomp-research
on:
  workflow_dispatch:
  push:
    branches: [claude/potion-duper]
    paths: ['research/decomp/**', '.github/workflows/decomp-research.yml']
jobs:
  decomp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - name: genSources
        working-directory: research/decomp
        run: |
          gradle --no-daemon -Pmc=${{ matrix.mc }} -Ploader=0.19.5 -Ploom_version=1.14-SNAPSHOT genSources --stacktrace || \
          gradle --no-daemon -Pmc=${{ matrix.mc }} -Ploader=0.19.5 -Ploom_version=1.18.2 genSources --stacktrace
      - name: collect
        run: |
          J=$(find ~/.gradle/caches research/decomp/.gradle -name '*-sources.jar' -path '*minecraft*' 2>/dev/null | grep -v client | head -5)
          echo "$J"
          mkdir -p out src
          for j in $J; do (cd src && unzip -oq "$j"); done
          ls src | head
          cd src
          zip -qr ../out/src-${{ matrix.mc }}.zip net/minecraft/world/entity net/minecraft/world/level/block/entity net/minecraft/world/level/portal net/minecraft/server/level net/minecraft/world/item/alchemy net/minecraft/core/dispenser net/minecraft/world/level/block 2>/dev/null || true
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: src-${{ matrix.mc }}
          path: out/
          retention-days: 3
