plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${mod_version}+mc${minecraft_version}"
group = 'dev.kanety'
base { archivesName = 'solaria-tools' }

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // optional integrations, compile only
    modCompileOnly("maven.modrinth:syncmatica:${syncmatica_version}") { transitive = false }
    modCompileOnly("maven.modrinth:xaeros-world-map:${xaero_worldmap_version}") { transitive = false }
    modCompileOnly("maven.modrinth:server_waypoint:${server_waypoint_version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}
